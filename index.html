<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Věrnostní Karta - Lekce</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; position: relative; transition: all 0.3s ease; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="tel"] { width: 100%; padding: 12px; margin: 10px 0 15px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .gdpr-text { font-size: 11px; color: #777; line-height: 1.4; margin-top: 15px; text-align: center; }
        button { width: 100%; background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .stamp { aspect-ratio: 1; background-color: #eee; border: 2px dashed #bbb; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; color: #888; cursor: pointer; transition: all 0.2s; user-select: none; line-height: 1.2; padding: 2px; box-sizing: border-box; }
        .stamp.active { background-color: #4CAF50; border: 2px solid #4CAF50; color: white; cursor: default; }
        .stamp.special { border: 2px dashed #ff9800; background-color: #fff3e0; color: #e65100; font-size: 11px; }
        .stamp.special.active { background-color: #4CAF50; border: 2px solid #4CAF50; color: white; }
        .sub-text { font-size: 8px; font-weight: normal; margin-top: 2px; display: block; }
        .bonus-section { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #ddd; }
        .bonus-stamp { width: 100%; padding: 20px; background-color: #e8f5e9; border: 3px dashed #2e7d32; border-radius: 12px; box-sizing: border-box; color: #2e7d32; font-weight: bold; font-size: 18px; cursor: pointer; transition: all 0.2s; user-select: none; }
        .bonus-stamp.active { background-color: #2e7d32; border: 3px solid #2e7d32; color: white; cursor: default; }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <div id="login-screen">
            <h2>Věrnostní Karta</h2>
            <p>Zadejte své telefonní číslo:</p>
            <input type="tel" id="phone" placeholder="777 123 456">
            <button onclick="login()">Vstoupit</button>
            <div class="gdpr-text">Vstupem do aplikace souhlasíte se zpracováním tel. čísla pro účely vedení věrnostní karty.</div>
        </div>
        <div id="card-screen" class="hidden">
            <h2>Vaše Lekce</h2>
            <div class="grid">
                <div class="stamp" onclick="toggleStamp(this, 1)">1</div>
                <div class="stamp" onclick="toggleStamp(this, 2)">2</div>
                <!-- Další políčka struktury -->
            </div>
        </div>
    </div>
</body>
</html>
<!-- Načtení oficiální knihovny Supabase z internetu -->
<script src="https://jsdelivr.net"></script>

<script>
    // Nastavení připojení k databázi Pohurka Karticka
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_Zvzw7LpbGSpCZK02mYyyWg_Xqxpe9Wk";
    
    // Inicializace klienta do unikátní proměnné sbc, aby nedocházelo ke kolizím
    const sbc = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPhone = "";
    let clientData = null;
    let checkInterval;
    const LIFETIME_DAYS = 62; // OSTRÝ PROVOZ: Karta platí 62 dní od zaškrtnutí 1. políčka

    // --- VYKRESLENÍ KARTY NA DISPLEJ ---
    function renderCardState() {
        clearInterval(checkInterval);
        
        if (clientData.stav_karty === 'uzamceno') {
            applyPermanentLockVisuals();
            return;
        }

        const stamps = document.querySelectorAll('.grid .stamp');
        stamps.forEach((stamp, index) => {
            stamp.classList.remove('active');
            const slotNumber = index + 1;
            if (slotNumber === 6) {
                stamp.innerHTML = `6<span class="sub-text">Doprovod za půlku</span>`;
            } else {
                stamp.innerHTML = slotNumber;
            }
        });

        const historie = clientData.historie_casu ? clientData.historie_casu.split(',') : [];
        
        historie.forEach((casText, index) => {
            if (index < stamps.length) {
                const stamp = stamps[index];
                stamp.classList.add('active');
                if (index === 5) {
                    stamp.innerHTML = `🏋️<span class="sub-text">Doprovod za 1/2</span><span class="sub-text" style="font-weight:bold;">${casText}</span>`;
                } else {
                    stamp.innerHTML = `🏋️<span class="sub-text">${casText}</span>`;
                }
            }
        });

        if (clientData.pocet_razitek === 10) {
            document.getElementById('bonus-container').classList.remove('hidden');
            document.getElementById('expiry-info').classList.add('hidden');
            return;
        }

        if (clientData.cas_aktivace) {
            checkCardExpiry();
            checkInterval = setInterval(checkCardExpiry, 60000); // Kontrola stačí jednou za minutu
        } else {
            document.getElementById('expiry-info').innerText = `⏱️ Karta bude platná 62 dní od prvního označení`;
        }
    }

    // --- HODNOCENÍ OSTRÉ EXPIRACE (62 DNÍ) ---
    function checkCardExpiry() {
        if (!clientData.cas_aktivace) return;

        const startTimestamp = parseInt(clientData.cas_aktivace, 10);
        const now = new Date().getTime();
        
        const msPassed = now - startTimestamp;
        const daysPassed = msPassed / (1000 * 60 * 60 * 24);
        const daysRemaining = Math.ceil(LIFETIME_DAYS - daysPassed);

        if (daysRemaining <= 0) {
            clearInterval(checkInterval);
            applyExpiryLockVisuals();
            if (clientData.stav_karty !== 'expirovano') {
                updateDatabaseField('stav_karty', 'expirovano');
            }
        } else {
            document.getElementById('expiry-info').innerText = `⏱️ Platnost karty končí za: ${daysRemaining} dní`;
        }
    }

    function applyPermanentLockVisuals() {
        document.getElementById('main-card').classList.add('locked');
        document.getElementById('sad-msg-container').classList.remove('hidden');
        document.getElementById('expired-msg-container').classList.add('hidden');
        document.getElementById('bonus-container').classList.add('hidden');
        document.getElementById('expiry-info').classList.add('hidden');
        document.getElementById('reset-btn').classList.remove('hidden');
        
        const stamps = document.querySelectorAll('.grid .stamp');
        stamps.forEach((stamp) => stamp.classList.add('active'));
        const bonusStamp = document.querySelector('.bonus-stamp');
        if(bonusStamp) {
            bonusStamp.classList.add('active');
            bonusStamp.innerText = "✅ VSTUP VYUŽIT";
        }
    }

    function applyExpiryLockVisuals() {
        document.getElementById('main-card').classList.add('locked');
        document.getElementById('expired-msg-container').classList.remove('hidden');
        document.getElementById('sad-msg-container').classList.add('hidden');
        document.getElementById('bonus-container').classList.add('hidden');
        document.getElementById('expiry-info').classList.add('hidden');
        document.getElementById('reset-btn').classList.remove('hidden');
    }

    function logout() {
        clearInterval(checkInterval);
        currentPhone = "";
        clientData = null;
        document.getElementById('phone').value = "";
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('card-screen').classList.add('hidden');
    }
    // --- ONLINE PŘIHLÁŠENÍ & REGISTRACE VŠECH ČÍSEL ---
        async function login() {
            const phoneInput = document.getElementById('phone').value.trim();
            if (!phoneInput) {
                alert("Zadejte prosím telefonní číslo.");
                return;
            }
            
            currentPhone = phoneInput;
            
            try {
                // Sbc komunikuje online se Supabase
                let { data, error } = await sbc
                    .from('klienti')
                    .select('*')
                    .eq('telefon', currentPhone)
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    // Pokud číslo neexistuje, automaticky vytvoříme nového klienta v online databázi
                    const { data: newClient, error: insertError } = await sbc
                        .from('klienti')
                        .insert([{ 
                            telefon: currentPhone, 
                            pocet_razitek: 0, 
                            cas_aktivace: "", 
                            historie_casu: "", 
                            stav_karty: "aktivni" 
                        }])
                        .select()
                        .single();

                    if (insertError) throw insertError;
                    clientData = newClient;
                } else {
                    clientData = data;
                }

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('card-screen').classList.remove('hidden');
                renderCardState();

            } catch (err) {
                console.error(err);
                alert("Chyba při komunikaci s databází: " + err.message);
            }
        }

        // --- UKLÁDÁNÍ LEKCÍ (ČINKY S DATEM DD.MM.) ---
        async function toggleStamp(element, number) {
            if (element.classList.contains('active') || clientData.stav_karty !== 'aktivni') return;
            if (number !== clientData.pocet_razitek + 1) return; 

            let updates = {};
            const nowTimestamp = new Date().getTime();
            
            // OSTRÝ PROVOZ: Pod činku ukládáme kalendářní den.měsíc. (např. 08.10.)
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const formattedDate = `${day}.${month}.`;

            if (clientData.pocet_razitek === 0 && !clientData.cas_aktivace) {
                updates.cas_aktivace = String(nowTimestamp);
                clientData.cas_aktivace = String(nowTimestamp);
            }

            let novaHistorie = clientData.historie_casu ? clientData.historie_casu.split(',') : [];
            novaHistorie.push(formattedDate);
            
            updates.pocet_razitek = clientData.pocet_razitek + 1;
            updates.historie_casu = novaHistorie.join(',');

            try {
                const { data, error } = await sbc
                    .from('klienti')
                    .update(updates)
                    .eq('telefon', currentPhone)
                    .select()
                    .single();

                if (error) throw error;
                clientData = data;
                renderCardState();
            } catch (err) {
                console.error(err);
                alert("Nepodařilo se odeslat lekci do databáze.");
            }
        }

        // --- VYUŽITÍ 11. BONUSU PŘES SERVER ---
        async function claimBonus(element) {
            if (element.classList.contains('active')) return;

            try {
                const { data, error } = await sbc
                    .from('klienti')
                    .update({ stav_karty: 'uzamceno' })
                    .eq('telefon', currentPhone)
                    .select()
                    .single();

                if (error) throw error;
                clientData = data;
                applyPermanentLockVisuals();
            } catch (err) {
                console.error(err);
                alert("Chyba při zamykání bonusu.");
            }
        }

        // --- RESET KARTY OBSLUHOU (KÓD 1234) ---
        async function unlockAndReset() {
            const pin = prompt("Zadejte 4místný kód obsluhy pro aktivaci nové karty:");
            
            if (pin === "1234") {
                try {
                    const { data, error } = await sbc
                        .from('klienti')
                        .update({
                            pocet_razitek: 0,
                            cas_aktivace: "",
                            historie_casu: "",
                            stav_karty: "aktivni"
                        })
                        .eq('telefon', currentPhone)
                        .select()
                        .single();

                    if (error) throw error;
                    clientData = data;
                    
                    document.getElementById('main-card').classList.remove('locked');
                    document.getElementById('sad-msg-container').classList.add('hidden');
                    document.getElementById('expired-msg-container').classList.add('hidden');
                    document.getElementById('reset-btn').classList.add('hidden');
                    document.getElementById('expiry-info').classList.remove('hidden');
                    
                    renderCardState();
                    alert("Karta klienta byla úspěšně vyčištěna pro nové kolo!");
                } catch (err) {
                    console.error(err);
                    alert("Chyba při resetování na serveru.");
                }
            } else {
                alert("Nesprávný kód obsluhy.");
            }
        }

        // Tichá online aktualizace expirace na pozadí
        async function updateDatabaseField(field, value) {
            let up = {}; up[field] = value;
            await sbc.from('klienti').update(up).eq('telefon', currentPhone);
        }
    </script>
</body>
</html>
